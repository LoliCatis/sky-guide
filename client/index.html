<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>SkyBlock трекер на русском: профиль, прогрессия, заработок</title>
    <meta name="description" content="Трекер Hypixel SkyBlock на русском: введи ник и получи план прогрессии, снаряжение, аксессуары, питомцев, гайды и способы заработка по живым ценам Bazaar и аукциона." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SkyBlock трекер на русском" />
    <meta property="og:description" content="Введи ник Minecraft и узнай, что делать дальше в Hypixel SkyBlock: план, снаряжение, заработок, гайды." />
    <meta property="og:locale" content="ru_RU" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Облегчённый режим (client/src/lite.js): решаем до первой отрисовки, чтобы на телефоне не запускать анимации зря -->
    <script>
      (function () {
        var on = false;
        try {
          var p = localStorage.getItem('sb-lite'), n = navigator, c = n.connection || {}, mm = function (q) { return !!(window.matchMedia && matchMedia(q).matches); };
          on = p === 'on' ? true : p === 'off' ? false
            : mm('(prefers-reduced-motion: reduce)') || !!c.saveData || /(^|-)2g$|^3g$/.test(c.effectiveType || '')
              || (n.deviceMemory && n.deviceMemory <= 2) || (n.hardwareConcurrency && n.hardwareConcurrency <= 2)
              || (mm('(pointer: coarse)') && mm('(max-width: 900px)'));
        } catch (e) { /* без localStorage — обычный режим */ }
        if (on) document.documentElement.classList.add('lite');
        document.documentElement.classList.add('js'); // готовый текст для поисковиков (.seo-pre) не показываем: сайт сам нарисует раздел
      })();
    </script>
    <style>html.js .seo-pre{display:none}.seo-pre{max-width:860px;margin:0 auto;padding:16px;font:16px/1.5 system-ui,sans-serif;color:#e8e8f0;background:#14141c}.seo-pre a{color:#9cf}.seo-pre table{border-collapse:collapse}.seo-pre td,.seo-pre th{border:1px solid #444;padding:2px 6px}</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
